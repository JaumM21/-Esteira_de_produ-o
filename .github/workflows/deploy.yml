name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar arquivos do site
        run: |
          mkdir _site
          cp index.html style.css _site/
          cp -r images _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  notificar-falha:
    name: Notificar falha no Discord
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensagem
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"Deploy FALHOU em ${{ github.repository }} (commit ${{ github.sha }}). Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK"
